name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check main.js
          node --check src/core/parse.js
          node --check src/core/validate.js
          node --check src/core/distribute.js
          node --check scripts/check-chains.mjs

      - name: Validate chain config
        run: node scripts/check-chains.mjs

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
